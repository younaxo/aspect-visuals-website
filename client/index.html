<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self';" />
  <title>Aspect Visuals</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --ease: cubic-bezier(0.22, 1, 0.36, 1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #09090b; color: #fafafa;
      font-family: "Onest", "Segoe UI", system-ui, sans-serif;
      user-select: none;
    }
    .shell { width: 100%; max-width: 460px; padding: 32px; }

    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .brand svg { width: 34px; height: 34px; color: #fafafa; }
    .brand span { font-size: 12px; font-weight: 600; letter-spacing: .24em; }

    .card {
      background: #18181b; border: 1px solid #27272a; border-radius: 14px; padding: 26px;
    }
    .status { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #a1a1aa; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #71717a; flex-shrink: 0; }
    .is-connecting .dot { background: #eab308; animation: pulse 1.1s ease-in-out infinite; }
    .is-online .dot { background: #22c55e; }
    .is-error .dot { background: #ef4444; }
    @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }

    .who { margin-top: 22px; display: none; }
    .is-online .who { display: block; }
    .name { font-size: 22px; font-weight: 700; overflow-wrap: anywhere; }
    .uid { margin-top: 3px; font-size: 12px; color: #71717a; }

    .roles { margin-top: 18px; display: flex; flex-wrap: wrap; gap: 6px; }
    .role {
      padding: 4px 10px; border-radius: 999px; font-size: 11.5px;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1); color: #d4d4d8;
    }

    .meta {
      margin-top: 22px; padding-top: 18px; border-top: 1px solid #27272a;
      display: grid; gap: 7px; font-size: 12px; color: #52525b;
    }
    .meta div { display: flex; justify-content: space-between; gap: 12px; }
    .meta b { font-weight: 500; color: #a1a1aa; overflow-wrap: anywhere; text-align: right; }

    .warn { margin-top: 14px; font-size: 12px; color: #eab308; display: none; }
    .warn.show { display: block; }

    .actions { margin-top: 22px; display: flex; gap: 8px; }
    button {
      height: 36px; padding: 0 18px; border-radius: 9px; border: 0; cursor: pointer;
      font-family: inherit; font-size: 13px; font-weight: 600;
      background: rgba(255,255,255,0.06); color: #a1a1aa;
      transition: background .18s var(--ease), color .18s var(--ease);
    }
    button:hover { background: rgba(255,255,255,0.1); color: #fafafa; }

    .hint { margin-top: 18px; font-size: 11.5px; line-height: 1.6; color: #3f3f46; text-align: center; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="brand">
      <svg viewBox="0 0 500 500" fill="none" aria-hidden="true">
        <g fill="currentColor">
          <polygon points="238,50 60,420 145,420 238,225" />
          <polygon points="262,50 262,225 355,420 440,420" />
          <polygon points="250,380 180,240 320,240" />
          <polygon points="175,445 325,445 345,465 155,465" />
        </g>
      </svg>
      <span>ASPECT VISUALS</span>
    </div>

    <div class="card is-connecting" id="card">
      <div class="status"><span class="dot"></span><span id="statusText">Подключаемся…</span></div>

      <div class="who">
        <div class="name" id="name">—</div>
        <div class="uid" id="uid"></div>
        <div class="roles" id="roles"></div>
      </div>

      <div class="warn" id="warn"></div>

      <div class="meta">
        <div><span>Сессия</span><b id="sessionId">—</b></div>
        <div><span>Сервер</span><b>aspectvisuals.su</b></div>
      </div>

      <div class="actions">
        <button type="button" id="quit">Выйти</button>
      </div>
    </div>

    <p class="hint">Ранняя сборка клиента. Авторизация выполнена через лаунчер Aspect Visuals.</p>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
