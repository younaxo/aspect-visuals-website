version: "3.8"

services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен, задайте его в .env рядом с docker-compose.prod.yml}
      POSTGRES_DB: aspect_visuals
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aspect_visuals"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD обязателен, задайте его в .env рядом с docker-compose.prod.yml}@postgres:5432/aspect_visuals
      FRONTEND_URL: https://aspectvisuals.su
      BACKEND_URL: https://aspectvisuals.su
      DISCORD_REDIRECT_URI: https://aspectvisuals.su/auth/discord/callback
      # TURNSTILE_* намеренно не задаются здесь: блок environment перекрывает env_file,
      # из-за чего прод раньше работал на тестовых ключах Cloudflare.
      # Реальные ключи приходят из backend/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
